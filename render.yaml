services:
  - type: web
    name: digitalization-advisor-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/digitalization_advisor.db
      - key: EXPORTS_DIR
        value: /var/data/exports
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GROQ_API_KEY
        sync: false
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
